name: Validate and deploy Strata
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/build_site.py _site
      - run: |
          for file in *.js tools/*.mjs; do node --input-type=module --check < "$file"; done
          python3 -m py_compile tools/capture/build.py tools/build_site.py
      - name: Verify the packaged courtyard under a project path
        run: |
          python3 -m http.server 8097 --bind 127.0.0.1 >/tmp/strata-http.log 2>&1 &
          google-chrome --headless --no-sandbox --enable-unsafe-swiftshader --remote-debugging-port=9296 --user-data-dir="$RUNNER_TEMP/strata-chrome" about:blank >/tmp/strata-chrome.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9296/json/version >/dev/null; then break; fi
            sleep 1
          done
          STRATA_URL=http://127.0.0.1:8097/_site/ node tools/check-courtyard.mjs
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
